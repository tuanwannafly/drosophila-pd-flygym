schema_version: 1
phase: G3
title: "Adult Drosophila Parkinson locomotion literature database"
scope: >
  Peer-reviewed adult Drosophila Parkinson or Parkinson-relevant locomotion
  evidence only. Larval locomotion and non-Parkinson disease models are
  excluded from mapped evidence. Computational mappings are hypotheses about
  measurable correspondence and do not validate a Parkinson's disease model.
status_terms:
  - SUPPORTED
  - PARTIALLY_SUPPORTED
  - NOT_SUPPORTED
repository_observables:
  currently_measured:
    - mean_planar_speed_mm_s
    - planar_displacement_mm
    - planar_path_length_mm
    - trajectory_efficiency
    - heading_yaw_change_rad
    - heading_yaw_abs_change_rad
    - body_height_min_mm
    - body_height_mean_mm
    - body_height_range_mm
    - joint_action_abs_mean
    - adhesion_duty_factor_by_leg
    - adhesion_transition_count_by_leg
  not_currently_measured:
    - negative_geotaxis_performance_index
    - climbing_success_fraction
    - climbing_velocity
    - movement_bout_distance
    - angular_velocity
    - open_field_center_avoidance
    - stop_or_freeze_duration
    - trial_reactivity_fraction
    - tremor_amplitude_or_frequency
    - inter_leg_coordination_phase
